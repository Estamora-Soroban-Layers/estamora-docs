site_name: Estamora Documentation
site_description: Policy-guarded payments, milestone escrow, pre-flight simulation SDK, and merchant console on Stellar (Soroban).
site_url: https://estamora-docs.vercel.app

repo_url: https://github.com/Estamora-Soroban-Layers/estamora-docs
repo_name: Estamora-Soroban-Layers/estamora-docs
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true

copyright: Apache-2.0. Estamora Soroban Layers.

nav:
  - Home: index.md
  - Concepts:
      - 3-Tier Architecture: concepts/the-layers.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
  - Reference:
      - Smart Contracts: reference/contracts.md
      - TypeScript SDK: reference/sdk.md
      - Merchant & Buyer App: reference/app.md
      - Security & Invariants: reference/security.md
