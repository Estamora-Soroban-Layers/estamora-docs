name: Documentation Bug
description: Report an inaccuracy, broken link, or missing guide in the documentation
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with the Estamora documentation hub.
  - type: textarea
    id: page
    attributes:
      label: Page URL or Path
      description: URL of the affected page (e.g. `reference/contracts.md` or https://estamora-docs.vercel.app/...).
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Inaccuracy or Issue
      description: What is inaccurate, broken, or unclear?
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested Fix
      description: How should this be updated or corrected?
    validations:
      required: false
