name: CI

# One job per question, and each has failed in a real project at least once:
#
#   build       -- does the site still assemble and render, with link validation strict?
#   pins        -- do the revisions this site is assembled from still exist upstream?
#   video       -- does the pitch play from the site, and are the figures it states still true?
#   links       -- does every URL the curated documentation points at still resolve?
#   navigation  -- is every curated page reachable, and does every entry lead somewhere?
#   pitch       -- is every reference to the pitch playable, rather than a download?
#   hardening   -- is every job here bounded and least-privileged?
#   tests       -- are the checks themselves tested, and do they still run as scripts?
#
# `pins` runs on a schedule as well as on a change, because the failure it catches is not
# caused by anything in this repository: a tag can be deleted or a newer release published
# while this repository is untouched.
#
# `tests` is the only job here that tests the checks rather than the site. It lives in this
# workflow rather than one of its own for the reason the checks share a workflow at all: a
# check that the thing it protects does not run is a check nobody runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The revisions the site is assembled from. Declared once, here, so the workflow and the
  # build script cannot disagree about what was pinned.
  ESTAMORA_RUNNER_TAG: v0.1.3
  ESTAMORA_SPEC_TAG: v0.1.1
  # The release the pitch video is fetched from. Pinned for the same reason the documents are:
  # a video that can change under a published URL without a commit here is one nobody can cite.
  ESTAMORA_PITCH_TAG: pitch-v1

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the documentation toolchain
        run: pip install --disable-pip-version-check -r requirements-docs.txt

      # One entry point for CI and for a contributor. It clones the pinned revisions into
      # `.vendor/`, assembles the curated pages with the canonical document sets, renders
      # with `strict: true`, and asserts both the assembled document count and the rendered
      # page count.
      - name: Assemble and render
        run: ./scripts/build-site.sh site

      # The failure this catches is subtle: a site that builds cleanly while one of the
      # assembled sections silently came out empty. The build script asserts this too; the
      # check is repeated here because it is cheap and because this is the artefact the
      # deploy job uploads.
      - name: The site contains all three sections
        run: |
          set -euo pipefail
          for section in runner spec; do
            pages="$(find "site/$section" -name 'index.html' | wc -l | tr -d ' ')"
            echo "$section: $pages page(s)"
            [ "$pages" -gt 0 ] || { echo "::error::$section rendered no pages"; exit 1; }
          done
          total="$(find site -name '*.html' | wc -l | tr -d ' ')"
          echo "total: $total page(s)"
          [ "$total" -gt 30 ] || { echo "::error::only $total pages"; exit 1; }

      # The video is the one asset whose absence would not fail the render: the landing page
      # builds fine with a player pointing at nothing. The build script asserts it too; it is
      # repeated here because this is the artefact the deploy job publishes.
      - name: The artefact carries the pitch video
        run: |
          set -euo pipefail
          video="site/assets/estamora-pitch.mp4"
          [ -s "$video" ] || { echo "::error::$video is missing or empty"; exit 1; }
          bytes="$(stat -c%s "$video")"
          [ "$bytes" -ge 1000000 ] || { echo "::error::$video is only $bytes bytes"; exit 1; }
          printf '%s: %s bytes\n' "$video" "$bytes"
          python3 -c "
          import sys
          header = open('$video','rb').read(12)
          if header[4:8] != b'ftyp':
              print('::error::the pitch is not an MP4', file=sys.stderr); sys.exit(1)
          "

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7

  pins:
    name: Check the pinned revisions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # A tag that no longer exists upstream turns every future build into a failure with a
      # confusing message from `git clone`. Checking it directly says which pin is wrong.
      - name: Every pinned revision resolves upstream
        run: |
          set -euo pipefail
          check() {
            local repo="$1" tag="$2"
            if git ls-remote --tags --exit-code "https://github.com/Estamora-Soroban-Layers/$repo" "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::notice::$repo@$tag resolves"
            else
              echo "::error::$repo@$tag does not exist upstream; update the pin in $GITHUB_WORKFLOW or the tag was deleted"
              exit 1
            fi
          }
          check estamora-conformance-runner "${ESTAMORA_RUNNER_TAG}"
          check estamora-conformance-spec "${ESTAMORA_SPEC_TAG}"
          # The pitch tag is on this repository, so the clone URL is this repository's. A
          # deleted or renamed release turns the build into a confusing download failure;
          # checking it directly says which pin is wrong.
          if git ls-remote --tags --exit-code \
              "https://github.com/Estamora-Soroban-Layers/estamora-docs" "refs/tags/${ESTAMORA_PITCH_TAG}" >/dev/null 2>&1; then
            echo "::notice::estamora-docs@${ESTAMORA_PITCH_TAG} resolves"
          else
            echo "::error::the pitch release tag ${ESTAMORA_PITCH_TAG} does not exist; the site would publish without its video"
            exit 1
          fi

      # Not a failure: the point is that drift is *reported* on a schedule rather than
      # discovered as a surprise. This repository's content is pinned on purpose.
      - name: Report newer tags, if any
        if: always()
        run: |
          set -euo pipefail
          report() {
            local repo="$1" pinned="$2"
            local latest
            latest="$(git ls-remote --tags --refs "https://github.com/Estamora-Soroban-Layers/$repo" \
              | awk -F/ '{print $NF}' | sort -V | tail -1)"
            if [ "$latest" != "$pinned" ]; then
              echo "::warning::$repo has moved to $latest while this site is pinned to $pinned"
            fi
          }
          report estamora-conformance-runner "${ESTAMORA_RUNNER_TAG}"
          report estamora-conformance-spec "${ESTAMORA_SPEC_TAG}"

  video:
    name: The pitch plays and its figures are still true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install the capture toolchain
        run: npm ci --prefix video

      # The browser is a separate download, and it is pinned by the Playwright version rather
      # than by this workflow: a Chromium that cannot decode H.264 reports a broken player for a
      # reason that has nothing to do with the video. See `video/README.md`.
      - name: Install the browser the capture pipeline needs
        run: npm --prefix video run install-browser

      # Two questions, and the second is the one nothing else in the organization asks.
      #
      # Does the published file play in a browser, as opposed to being served? `deploy-vercel.yml`
      # asserts the content type and the byte ranges, which is what a browser needs. This asks
      # the browser what happened, because a response can satisfy every header and still leave the
      # element with no metadata.
      #
      # And is every figure the narration states still true? Nothing breaks when the project moves
      # on: the file plays, the links resolve, and the voice states a number that is now wrong.
      # This reads each figure out of the artefact that owns it -- the committed report, the
      # organization's repository list -- and fails when they disagree.
      #
      # It checks the *deployed* sites rather than a local build, deliberately: the video the
      # reader watches is the deployed one, and that is the artefact whose accuracy is in question.
      # A consequence worth stating: this job failing can mean the deployment is down rather than
      # that this repository is wrong, and the message says which.
      - name: Verify the pitch
        run: node video/verify.mjs

  links:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Checks the URLs written in *this* repository. The assembled documents are checked by
      # MkDocs' own link validation against the site, and their external links are rewritten
      # to hosts that are already asserted to serve the normative trees.
      - name: Every external URL in the curated documentation resolves
        run: python3 scripts/check-external-links.py

  # The three checks below assert properties of this repository rather than of the site. Each is
  # a separate job because each fails for a different reason, and a failure should name which.
  # None of them installs anything: they are searches and parses, and a check that runs in a
  # second is one that cannot fail for an unrelated reason.
  navigation:
    name: Navigation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install PyYAML, which is all this needs
        run: python3 -m pip install --quiet 'pyyaml>=6'

      # A curated page that is built but not navigable is a page nobody reads, and a nav entry
      # naming a file that is not there publishes a dead link.
      - name: Every curated document is navigable and every target exists
        run: python3 scripts/check-nav.py

  pitch:
    name: The pitch stays playable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # A GitHub release asset is served as application/octet-stream with
      # content-disposition: attachment, so a link to one *downloads* 15 MB instead of playing
      # it. Every header check passes and the reader gets a file rather than a video. Serving
      # the same bytes from this site as video/mp4 is the fix; this keeps it fixed.
      - name: Every reference to the pitch keeps it playable
        run: python3 scripts/check-pitch-references.py

  hardening:
    name: Workflow hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Every job declares a timeout and explicit permissions, and no workflow uses
      # pull_request_target -- the one trigger that runs with the base token on a fork's code.
      - name: Every workflow is least-privilege and bounded
        run: python3 scripts/check-workflows.py

  tests:
    name: The checks are tested
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install the test dependencies
        run: pip install --disable-pip-version-check -r requirements-test.txt

      # The denominator is stated here rather than left to the configuration, because a
      # coverage figure with an unstated denominator measures whatever the tests happened to
      # load. The scope is the five Python checks. What is not in it: the shell entry points,
      # which are not Python; `video/*.py`, which needs piper and ffmpeg and is checked by the
      # `video` job instead; and the five `sys.exit(main())` lines, which the step below
      # executes rather than asserts.
      - name: Test the checks, with the floor enforced
        run: python3 -m pytest tests --cov=scripts --cov-report=term-missing --cov-fail-under=70

      # An in-process test exercises a check's logic. It does not exercise `__main__`, the exit
      # code a pipeline reads, or whether the file is executable at all -- so the checks that
      # need nothing external are also run the way a contributor runs them. That is the only
      # thing that executes `sys.exit(main())`.
      #
      # `check-external-links.py` is left out because the `links` job already fetches every URL
      # it names, and running it twice would double the requests to other people's hosts.
      # `check-deployed-links.py` is left out because it asserts against a deployment, and there
      # is not one yet: it runs in `deploy-vercel.yml`, after the thing it checks exists.
      - name: Run the checks as scripts, which is how they are actually used
        run: |
          set -euo pipefail
          for check in scripts/check-nav.py scripts/check-pitch-references.py scripts/check-workflows.py; do
            echo "--- $check"
            python3 "$check"
          done
