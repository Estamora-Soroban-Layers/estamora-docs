name: Deploy to Vercel

# What is deployed is what CI built.
#
# The alternative -- letting Vercel build the site from the repository -- would mean the
# published artefact comes from a second build, on a different machine, with a Python and an
# MkDocs version Vercel chose rather than one this repository pins. The site is assembled from
# tagged revisions of two other repositories, so a build that is not the one CI validated is a
# build nobody checked.
#
# So this workflow builds the site the same way `ci.yml` does, and then publishes that exact
# directory. Vercel's own build step (`scripts/assert-built.sh`) asserts the artefact exists
# instead of producing it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

env:
  ESTAMORA_RUNNER_TAG: v0.1.3
  ESTAMORA_SPEC_TAG: v0.1.1
  ESTAMORA_PITCH_TAG: pitch-v1
  # The Vercel project is identified by these two rather than by a committed `.vercel/`
  # directory, so nothing about the link lives in the repository and rotating the project is
  # a settings change rather than a commit.
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://estamora-docs.vercel.app
    steps:
      - name: Fail early when the deployment credentials are absent
        # A missing secret otherwise surfaces as an authentication error from inside the
        # Vercel CLI, which reads like a permissions problem rather than a missing setting.
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set for this repository"
              exit 1
            fi
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the documentation toolchain
        run: pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Assemble and render the site
        run: ./scripts/build-site.sh site

      - name: Set up Node.js for the Vercel CLI
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Retrieve the project settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Package the artefact CI built
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Publish it
        id: deploy
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tail -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: The deployed site serves the pages it should
        # Deployed is not the same as serving. This asserts the alias resolves and answers,
        # rather than trusting the CLI's exit code for the definition of success.
        run: |
          set -euo pipefail
          for path in "/" "/getting-started/installation/" "/runner/cli/" "/spec/authorization-model/"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 30 "https://estamora-docs.vercel.app$path")"
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

      - name: The deployed pitch video plays, rather than downloads
        # The landing page embeds a player, and `200` would not mean the player works. Two
        # things have to be true of the response for a browser to play and seek it: a media
        # content type, and byte-range support. A `.mp4` served as octet-stream with
        # `content-disposition: attachment` -- which is what a GitHub release asset is --
        # downloads instead of playing, and a link checker would call that a working link.
        #
        # This is asserted against the deployed origin rather than the build output because
        # the content type is the *host's* decision, not the file's.
        run: |
          set -euo pipefail
          url="https://estamora-docs.vercel.app/assets/estamora-pitch.mp4"

          headers="$(curl -s -D - -o /dev/null -m 60 "$url" | tr -d '\r')"
          type="$(printf '%s\n' "$headers" | grep -i '^content-type:' | awk '{print $2}' | tr -d '\r')"
          ranges="$(printf '%s\n' "$headers" | grep -i '^accept-ranges:' | awk '{print $2}' | tr -d '\r')"
          echo "content-type: $type"
          echo "accept-ranges: $ranges"
          case "$type" in
            video/mp4*) ;;
            *) echo "::error::$url is served as '$type'; a browser will download it instead of playing it"; exit 1 ;;
          esac
          [ "$ranges" = "bytes" ] || { echo "::error::$url does not accept byte ranges, so the player cannot seek"; exit 1; }

          code="$(curl -s -o /dev/null -w '%{http_code}' -m 60 -r 0-1023 "$url")"
          echo "range request -> $code"
          [ "$code" = "206" ] || { echo "::error::a byte-range request returned $code, not 206"; exit 1; }

          code="$(curl -s -o /dev/null -w '%{http_code}' -m 30 "https://estamora-docs.vercel.app/assets/pitch-thumbnail.png")"
          echo "poster -> $code"
          [ "$code" = "200" ] || { echo "::error::the player's poster returned $code"; exit 1; }
