name: Deploy to Vercel

# What is deployed is what CI built.
#
# The alternative -- letting Vercel build the site from the repository -- would mean the
# published artefact comes from a second build, on a different machine, with a Python and an
# MkDocs version Vercel chose rather than one this repository pins. The site is assembled from
# tagged revisions of two other repositories and fetches its pitch video from a release, so a
# build that is not the one CI validated is a build nobody checked.
#
# So this workflow builds the site the same way `ci.yml` does, and then publishes that exact
# directory. Vercel's own build step (`scripts/assert-built.sh`) asserts the artefact exists
# instead of producing it.
#
# # The order of the assertions at the end
#
# `vercel deploy` returning is not the same as the alias serving what was just deployed: the
# edge takes a moment to switch, and during that moment the production URL still answers with
# the *previous* deployment. The first version of this workflow asserted the pitch against the
# alias immediately and failed on a deployment that was correct -- it had read the old
# deployment's not-found page, whose content type is `text/html`.
#
# So the pitch step runs first, and it is the step that waits: it checks the immutable
# deployment URL (immediately consistent, because it is the artefact this job built) and then
# waits, in bounded steps, for the alias to catch up. Every check after it is a check of the
# alias, and can therefore rely on the alias having moved.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

env:
  ESTAMORA_RUNNER_TAG: v0.1.3
  ESTAMORA_SPEC_TAG: v0.1.1
  ESTAMORA_PITCH_TAG: pitch-v1
  # The Vercel project is identified by these two rather than by a committed `.vercel/`
  # directory, so nothing about the link lives in the repository and rotating the project is
  # a settings change rather than a commit.
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://estamora-docs.vercel.app
    steps:
      - name: Fail early when the deployment credentials are absent
        # A missing secret otherwise surfaces as an authentication error from inside the
        # Vercel CLI, which reads like a permissions problem rather than a missing setting.
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set for this repository"
              exit 1
            fi
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the documentation toolchain
        run: pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Assemble and render the site
        run: ./scripts/build-site.sh site

      - name: Set up Node.js for the Vercel CLI
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Retrieve the project settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Package the artefact CI built
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Publish it
        id: deploy
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tail -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: The pitch plays, rather than downloading
        # The landing page embeds a player, and `200` would not mean the player works. Two
        # things have to be true of the response for a browser to play and seek it: a media
        # content type, and byte-range support. A `.mp4` served as octet-stream with
        # `content-disposition: attachment` -- which is what a GitHub release asset is --
        # downloads instead of playing, and a link checker would call that a working link.
        #
        # The content type is the *host's* decision rather than the file's, so this is asserted
        # against the deployed origin and not against the build output. This is also the step
        # that waits for the alias, so that the checks below can rely on it having moved.
        #
        # The deployment URL the CLI returns is *not* checked, deliberately. It is behind Vercel
        # Authentication: an unauthenticated request for it answers `302` to an SSO prompt with
        # `content-type: text/plain`, and that is a protection working rather than a deployment
        # being broken. The only URL a reader can reach is the alias, so the alias is the only
        # thing worth asserting.
        run: |
          set -euo pipefail

          alias="https://estamora-docs.vercel.app"
          video="/assets/estamora-pitch.mp4"

          check_playable() {
            local url="$1"
            local headers type ranges code
            headers="$(curl -s -D - -o /dev/null -m 60 "$url" | tr -d '\r')"
            type="$(printf '%s\n' "$headers" | awk 'tolower($1) == "content-type:" {print $2}')"
            ranges="$(printf '%s\n' "$headers" | awk 'tolower($1) == "accept-ranges:" {print $2}')"
            printf '  content-type=%s  accept-ranges=%s\n' "$type" "$ranges"
            case "$type" in
              video/mp4*) ;;
              *) echo "::error::$url is served as '$type'; a browser will download it instead of playing it"; return 1 ;;
            esac
            [ "$ranges" = "bytes" ] || { echo "::error::$url does not accept byte ranges, so the player cannot seek"; return 1; }
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 60 -r 0-1023 "$url")"
            printf '  range request -> %s\n' "$code"
            [ "$code" = "206" ] || { echo "::error::a byte-range request to $url returned $code, not 206"; return 1; }
          }

          echo "the production alias, once the edge has switched to it:"
          deadline=12
          for attempt in $(seq 1 "$deadline"); do
            if check_playable "$alias$video"; then
              echo "::notice::the production alias serves playable video (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "$deadline" ]; then
              echo "::error::the production alias did not serve playable video within $deadline attempts; the deployment is published but the edge has not switched, or the response is not media"
              exit 1
            fi
            echo "  not yet; waiting 15s"
            sleep 15
          done

          code="$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$alias/assets/pitch-thumbnail.png")"
          echo "poster -> $code"
          [ "$code" = "200" ] || { echo "::error::the player's poster returned $code"; exit 1; }

      - name: The deployed site serves the pages it should
        # Deployed is not the same as serving. This asserts the alias resolves and answers,
        # rather than trusting the CLI's exit code for the definition of success.
        run: |
          set -euo pipefail
          for path in "/" "/getting-started/installation/" "/runner/cli/" "/spec/authorization-model/"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 30 "https://estamora-docs.vercel.app$path")"
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

      - name: Every URL the site's own pages reference is served
        # The CI link checker skips this site's own host on purpose: it runs in a job that
        # cannot see the deployment, so a URL naming an artefact the deploy publishes could only
        # race it. That is not hypothetical -- the first version of this check ran in CI, found
        # the pitch in the README before the deployment carrying it had published, and reported
        # a 404 for a file that was served correctly seconds later.
        #
        # This is where those URLs can be checked honestly. They are derived from the built
        # pages -- every relative `src` and `href` resolved the way a browser resolves it, plus
        # this repository's own absolute self-references -- so the list cannot go stale, and it
        # covers the failure MkDocs' build-time link validation cannot see: a relative reference
        # inside raw HTML, which is how the landing page embeds its player.
        run: python3 scripts/check-deployed-links.py --site site
