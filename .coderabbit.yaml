# CodeRabbit review configuration for Estamora Protocol Documentation.
language: en-US
early_access: false
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!site/**"
    - "!build/**"
    - "!.vercel/**"
    - "!node_modules/**"
  path_instructions:
    - path: "docs/**/*.md"
      instructions: >-
        Validate that contract interfaces, SDK methods, and protocol specifications
        accurately reflect the current Estamora Soroban implementation.
    - path: "mkdocs.yml"
      instructions: >-
        Uses !ENV tags. Nav entries must resolve to files that exist; a dangling nav
        entry fails the build.
  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
chat:
  auto_reply: true
